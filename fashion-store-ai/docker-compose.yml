# ============================================================================== #
#                   FASHION STORE AI - DOCKER COMPOSE CONFIG                     #
# ============================================================================== #

services:
  # ========================================== #
  # 1. DATABASE SERVICE (MongoDB 7)            #
  # ========================================== #
  mongo:
    image: mongo:7
    container_name: fashion-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ========================================== #
  # 2. BACKEND SERVICE (FastAPI + AI-Core)     #
  # ========================================== #
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fashion-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      CHROMA_PERSIST_DIR: /app/data/chroma
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - chroma_data:/app/data/chroma
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  # ========================================== #
  # 3. FRONTEND SERVICE (Vue 3 + Nginx)        #
  # ========================================== #
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fashion-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

# ========================================== #
# VOLUMES PERSISTENCE                        #
# ========================================== #
volumes:
  mongo_data:
  chroma_data:
